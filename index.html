<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7faf8" />
    <meta
      name="description"
      content="Lotka-Volterra 모형으로 포식자와 피식자의 개체군 변동을 탐구하는 교육용 시뮬레이션"
    />
    <title>포식자-피식자 동역학 실험실</title>
  </head>
  <body>
    <div id="app"></div>
    <footer class="site-brand-footer">
      <p class="site-brand-footer__name">HAFS Biology Lab</p>
      <p class="site-brand-footer__credit">Teacher-built interactive science tools · CH Park</p>
    </footer>
    <p class="page-views page-views--standalone" data-page-views hidden></p>
    <!-- 조회수: 포털 공통 모듈(suimaire.github.io/assets/js/page-views.js). production 에서만 로드되며 실패해도 앱과 무관 -->
    <script>
      (function () {
        try {
          if (location.hostname !== 'suimaire.github.io' && !/[?&]page-views=/.test(location.search)) return;
          var s = document.createElement('script');
          s.type = 'module';
          s.src = 'https://suimaire.github.io/assets/js/page-views.js';
          document.head.appendChild(s);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
